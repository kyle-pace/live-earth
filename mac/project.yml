# Live Earth for Mac. Generate the Xcode project with `xcodegen generate` in mac/.
name: LiveEarth
options:
  bundleIdPrefix: dev.kylepace
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  Amplitude-Swift:
    url: https://github.com/amplitude/Amplitude-Swift
    from: 1.19.3
settings:
  base:
    DEVELOPMENT_TEAM: 9BF66MY8TQ
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "5.0"
targets:
  LiveEarth:
    type: application
    platform: macOS
    sources:
      - LiveEarth/Sources
      - LiveEarth/Resources
    dependencies:
      - package: Amplitude-Swift
        product: AmplitudeSwift
    entitlements:
      path: LiveEarth/LiveEarth.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.kylepace.live-earth
        PRODUCT_NAME: Live Earth
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Live Earth
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.weather
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Kyle Pace"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
